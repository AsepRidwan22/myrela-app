stages:
  - test
  - build
  - deploy

variables:
  APP_DIR: source
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "/certs"
  APP_IMAGE: $CI_REGISTRY_IMAGE/app

default:
  image: docker:27
  services:
    - docker:27-dind
  before_script:
    - docker info

test:laravel:
  stage: test
  script:
    - docker build -t "$APP_IMAGE:$CI_COMMIT_SHA" -f docker/php/Dockerfile .
    - |
      docker run --rm \
      -v "$CI_PROJECT_DIR/$APP_DIR:/var/www" \
      -w /var/www \
      "$APP_IMAGE:$CI_COMMIT_SHA" \
      sh -lc '
        set -e
        [ -f .env ] || cp .env.example .env
        composer install --no-interaction --prefer-dist --no-progress
        npm ci
        npm run build
        touch database/database.sqlite
        php artisan key:generate
        php artisan test
      '
  rules:
    - if: $CI_COMMIT_BRANCH

build:image:
  stage: build
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker build -t "$APP_IMAGE:$CI_COMMIT_SHA" -t "$APP_IMAGE:latest" -f docker/php/Dockerfile .
    - docker push "$APP_IMAGE:$CI_COMMIT_SHA"
    - docker push "$APP_IMAGE:latest"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

deploy:production:
  stage: deploy
  image: alpine:3.21
  before_script:
    - apk add --no-cache openssh-client
    - eval "$(ssh-agent -s)"
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan -p "${SSH_PORT:-22}" "$SSH_HOST" >> ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
  script:
    - |
      ssh -p "${SSH_PORT:-22}" "$SSH_USER@$SSH_HOST" "
        set -e
        cd '${DEPLOY_PATH:-/opt/rela-app}'
        git pull origin main
        docker compose up -d --build
        docker compose ps
      "
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
  environment:
    name: production