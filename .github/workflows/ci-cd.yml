name: CI-CD

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches:
      - main
      - develop
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    name: Laravel CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_sqlite, sqlite3
          tools: composer:v2
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: source/vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('source/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare Laravel environment
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite

      - name: Run migrations
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
        run: php artisan migrate --force

      - name: Run tests
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
        run: php artisan test

      - name: Install Node dependencies
        run: npm ci || npm install

      - name: Build frontend assets
        run: npm run build

  cd:
    name: Deploy to server
    runs-on: ubuntu-latest
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Validate deploy secrets
        env:
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USERNAME: ${{ secrets.DEPLOY_USERNAME }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          if [ -z "$TS_AUTHKEY" ] || [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_USERNAME" ] || [ -z "$DEPLOY_SSH_KEY" ]; then
            echo "Missing deploy secrets. Required: TS_AUTHKEY, DEPLOY_HOST, DEPLOY_USERNAME, DEPLOY_SSH_KEY"
            exit 1
          fi

      - name: Connect runner to Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}

      - name: Verify Tailscale reachability
        run: |
          tailscale status
          HOST="${{ secrets.DEPLOY_HOST }}"
          PORT="${{ secrets.DEPLOY_PORT || 22 }}"
          tailscale ping -c 2 "$HOST" || true
          timeout 7 bash -c "cat < /dev/null > /dev/tcp/$HOST/$PORT" || {
            echo "Cannot reach $HOST on TCP port $PORT over Tailscale"
            exit 1
          }

      - name: Deploy via SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || 22 }}
          DEPLOY_USERNAME: ${{ secrets.DEPLOY_USERNAME }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail

          if [ -z "$DEPLOY_PATH" ]; then
            DEPLOY_PATH="/var/www/rela-app/myrela-app"
          fi

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          ssh-keyscan -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" -o StrictHostKeyChecking=accept-new "$DEPLOY_USERNAME@$DEPLOY_HOST" <<EOF
          set -e
          if [ ! -d "$DEPLOY_PATH" ]; then
            echo "Deploy path not found: $DEPLOY_PATH"
            echo "Available folders under /var/www/rela-app:"
            ls -la /var/www/rela-app || true
            exit 1
          fi

          cd "$DEPLOY_PATH"
          git pull origin main
          composer install --no-dev --optimize-autoloader --no-interaction
          php artisan migrate --force
          npm ci
          npm run build
          php artisan optimize:clear
          EOF